<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RouteGuard AI | Command Center</title>

    <link rel="stylesheet" href="command.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        .map-loading {
            padding: 14px 18px;
            font-size: 13px;
            color: #00d084;
            background: rgba(0, 208, 132, 0.06);
            border: 1px solid rgba(0, 208, 132, 0.2);
            border-radius: 10px;
            margin-top: 10px;
        }

        .route-info-card {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #1c3043;
            border-radius: 14px;
            background: #091521;
        }

        .route-info-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .route-info-row small {
            display: block;
            color: #7f92a6;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .route-info-row strong {
            display: block;
            margin-top: 4px;
            font-size: 14px;
        }

        .alternate-title {
            color: #7f92a6;
            font-size: 9px;
            letter-spacing: 1px;
            margin: 10px 0 8px;
        }

        .alternate-route {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #1c3043;
            border-radius: 10px;
            background: #07111c;
            color: white;
            cursor: pointer;
        }

        .alternate-route.selected {
            border-color: #00d084;
            background: rgba(0, 208, 132, 0.08);
        }

        .vehicles-section, .system-status-section {
            margin-top: 24px;
            padding: 22px;
            border: 1px solid #1c3043;
            border-radius: 16px;
            background: #091521;
        }

        .vehicle-table .table-header,
        .vehicle-table .table-row {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr 1fr;
            gap: 10px;
            padding: 10px 6px;
            font-size: 12px;
        }

        .vehicle-table .table-header {
            color: #7f92a6;
            font-size: 10px;
            letter-spacing: 1px;
            border-bottom: 1px solid #1c3043;
        }
