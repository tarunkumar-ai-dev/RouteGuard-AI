<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RouteGuard AI | Mission Select</title>

    <link rel="stylesheet" href="mission.css">
</head>

<body>

    <main class="mission-screen">

        <header class="topbar">

            <div class="brand">
                RouteGuard <span>AI</span>
            </div>

            <div class="system">
                <span></span>
                SYSTEM OPERATIONAL
            </div>

        </header>


        <section class="intro">

            <p class="eyebrow">
                AI LOGISTICS COMMAND CENTER
            </p>

            <h1>
                Select your <span>mission.</span>
            </h1>

            <p>
                Choose what you want RouteGuard AI to monitor,
                predict or optimize.
            </p>

        </section>


        <section class="missions">


            <!-- MISSION 1 -->

            <button class="mission-card">

                <div class="icon">
                    🚚
                </div>

                <div class="mission-content">

                    <span class="mission-number">
                        01 / OPERATIONS
                    </span>

                    <h2>
                        Fleet Monitoring
                    </h2>

                    <p>
                        Track active vehicles, locations,
                        routes and delivery status in real time.
                    </p>

                    <div class="mission-action">
                        Open Mission →
                    </div>

                </div>

            </button>


            <!-- MISSION 2 -->

            <button class="mission-card">

                <div class="icon">
                    🧠
                </div>

                <div class="mission-content">

                    <span class="mission-number">
                        02 / PREDICTION
                    </span>

                    <h2>
                        Risk Prediction
                    </h2>

                    <p>
                        Detect potential traffic, flood,
                        accident and road disruption risks.
                    </p>

                    <div class="mission-action">
                        Open Mission →
                    </div>

                </div>

            </button>


            <!-- MISSION 3 -->

            <button class="mission-card">

                <div class="icon">
                    🗺️
                </div>

                <div class="mission-content">

                    <span class="mission-number">
                        03 / OPTIMIZATION
                    </span>

                    <h2>
                        Route Optimization
                    </h2>

                    <p>
                        Compare routes and let AI recommend
                        the safest and most efficient path.
                    </p>

                    <div class="mission-action">
                        Open Mission →
                    </div>

                </div>

            </button>


            <!-- MISSION 4 -->

            <button class="mission-card">

                <div class="icon">
                    🌧️
                </div>

                <div class="mission-content">

                    <span class="mission-number">
                        04 / DISASTER WATCH
                    </span>

                    <h2>
                        Disaster Watch
                    </h2>

                    <p>
                        Monitor flood, landslide, weather
                        and road-block threats.
                    </p>

                    <div class="mission-action">
                        Open Mission →
                    </div>

                </div>

            </button>

        </section>


        <section class="quick-route">

            <div>
                <span>QUICK START</span>

                <h3>
                    Already know your route?
                </h3>

                <p>
                    Jump directly into AI route analysis.
                </p>
            </div>

            <button>
                Analyze a Route →
            </button>

        </section>


        <footer>
            RouteGuard AI • Smart Logistics & Accessibility
        </footer>

        <script src="mission.js"></script>

    </main>

</body>

</html>
