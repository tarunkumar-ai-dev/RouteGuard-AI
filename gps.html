<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RouteGuard AI | GPS</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07152f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(20, 50, 100, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #4d78b8;
            background: #0d2145;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #startBtn {
            background: #19d3b1;
        }

        #stopBtn {
            background: #ff5c5c;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #0b1d3c;
        }

    </style>

</head>


<body>

<div class="card">

    <h1>🚚 RouteGuard AI</h1>

    <p>
        Live GPS Vehicle Tracker
    </p>

    <input
        id="vehicleId"
        type="text"
        value="RG-101"
        placeholder="Vehicle ID"
    >

    <button
        id="startBtn"
        onclick="startTracking()"
    >
        📍 Start GPS Tracking
    </button>

    <button
        id="stopBtn"
        onclick="stopTracking()"
    >
        ⛔ Stop Tracking
    </button>

    <div id="status">
        GPS not started.
    </div>

</div>


<script>

const BACKEND_URL =
    window.location.origin;

let watchId = null;


// ==========================================
// START GPS
// ==========================================

function startTracking() {

    if (!navigator.geolocation) {

        updateStatus(
            "❌ This browser does not support GPS."
        );

        return;
    }


    const vehicleId =
        document
            .getElementById("vehicleId")
            .value
            .trim();


    if (!vehicleId) {

        updateStatus(
            "❌ Enter Vehicle ID."
        );

        return;
    }


    updateStatus(
        "📡 Requesting GPS permission..."
    );


    watchId =
        navigator.geolocation.watchPosition(

            position => {

                sendLocation(
                    vehicleId,
                    position
                );

            },

            error => {

                console.error(error);

                updateStatus(
                    "❌ GPS Error: " +
                    error.message
                );

            },

            {
                enableHighAccuracy: true,

                maximumAge: 5000,

                timeout: 10000

            }

        );

}


// ==========================================
// SEND GPS TO BACKEND
// ==========================================

async function sendLocation(
    vehicleId,
    position
) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const speed =
        position.coords.speed;

    const heading =
        position.coords.heading;


    updateStatus(

        "📡 Sending real GPS location..." +

        "<br><br>" +

        "Latitude: " +
        latitude +

        "<br>" +

        "Longitude: " +
        longitude

    );


    try {

        const response =
            await fetch(

                BACKEND_URL +
                "/api/vehicles/location",

                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            vehicle_id:
                                vehicleId,

                            latitude:
                                latitude,

                            longitude:
                                longitude,

                            speed:
                                speed !== null
                                    ? speed * 3.6
                                    : null,

                            heading:
                                heading,

                            status:
                                "active"

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Backend rejected GPS data."
            );

        }


        updateStatus(

            "🟢 LIVE GPS CONNECTED" +

            "<br><br>" +

            "Vehicle: " +
            vehicleId +

            "<br>" +

            "Latitude: " +
            latitude.toFixed(6) +

            "<br>" +

            "Longitude: " +
            longitude.toFixed(6) +

            "<br>" +

            "Updated: " +
            new Date().toLocaleTimeString()

        );


    }

    catch (error) {

        console.error(error);

        updateStatus(

            "❌ Backend connection failed." +

            "<br><br>" +

            error.message

        );

    }

}


// ==========================================
// STOP GPS
// ==========================================

function stopTracking() {

    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }


    updateStatus(
        "⛔ GPS tracking stopped."
    );

}


// ==========================================
// STATUS UI
// ==========================================

function updateStatus(message) {

    document
        .getElementById("status")
        .innerHTML = message;

}

</script>

</body>

</html>
